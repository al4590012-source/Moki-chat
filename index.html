<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Moki Chat</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="start-bg">

  <!-- Thỏ + tim + bong bóng -->
  <div class="bunny">🐰</div>
  <div class="heart">💗</div>
  <div class="heart delay">💗</div>
  <div class="bubble"></div>
  <div class="bubble small"></div>

  <!-- Start screen -->
  <div class="start-screen">
    <div class="start-box">
      <h1>💗 Moki Chat 💗</h1>
      <p>ấn vào đây để bắt đầu 💗✨</p>
    </div>
  </div>

  <script>
    // ===== Web Audio API =====
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    const ctx = new AudioContext();

    // ===== Tạo nhạc nền chill =====
    function playChillLoop() {
      const osc1 = ctx.createOscillator();
      const gain1 = ctx.createGain();
      osc1.type = 'sine';
      osc1.frequency.value = 220; // nốt A3
      gain1.gain.value = 0.02; // âm lượng nhỏ, chill
      osc1.connect(gain1).connect(ctx.destination);
      osc1.start();
      osc1.stop(ctx.currentTime + 2);

      // random nốt tiếp theo
      setTimeout(playChillLoop, 500 + Math.random() * 1000);
    }

    // ===== Tạo hiệu ứng phép thuật =====
    function playMagic() {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(600, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(1200, ctx.currentTime + 0.3);
      gain.gain.setValueAtTime(0.2, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
      osc.connect(gain).connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.3);
    }

    // ===== Tự động bật khi người dùng click 1 lần =====
    document.body.addEventListener('click', function startAudio() {
      ctx.resume(); // cần resume context khi browser chặn autoplay
      playMagic(); // phép thuật 1 lần
      playChillLoop(); // nhạc nền chill loop
      document.body.removeEventListener('click', startAudio);
    });
  </script>

</body>
</html>
